version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-lzo1x is knowledge that belongs to rust-lzo1x. This was
# the last crate in the family without a chores.yml, which meant `chore lint`
# — the one command that reproduces the CI gate locally — did not exist here
# and the gate could only be discovered from a red build.
#
# WHAT MAKES THIS CRATE DIFFERENT FROM ITS SIBLINGS, and why the tasks below
# are not a copy of theirs:
#
#   1. NO C ABI AND NO HEADERS. Every sibling library emits `include/<name>.h`
#      and a set of `extern "C"` exports. This crate has neither: it is a pure
#      Rust decompressor consumed as an rlib. `staticlib` therefore copies an
#      archive and nothing else.
#
#   2. NOTHING LINKS ITS ARCHIVE. rust-fs-squashfs takes this crate as
#      `rust-lzo1x = "0.1.0"` — a normal crates.io dependency resolved by cargo,
#      not a `.a` handed to ld. So `staticlib` exists for uniformity with the
#      sibling libraries and for anyone building this crate alone; no consumer
#      in the family uses its output today.
#
#   3. CI RUNS THE SUITE TWICE. Once normally, and once with `--ignored` to
#      pick up the lzop oracle in tests/oracle_lzop.rs. See `test` below —
#      getting that wrong would make the local gate quietly weaker than CI,
#      which is the exact failure this file exists to prevent.
# QUIET BY DEFAULT, --verbose ON REQUEST, AND THE BUDGET IS A NUMBER (#20).
#
# Every test tier runs through ../rust-fs-core/scripts/tier.sh, which runs it quietly: the
# whole transcript goes to tmp/logs/<tier>.log, a pass prints ONE verdict line
# naming that log, a failure prints one line naming the command's own status,
# and a run that passed but printed more than its budget exits 65 -- a status
# that can be told apart from a failing suite.
#
# WHY A DECOMPRESSOR CARES. This crate is what two filesystem drivers feed
# untrusted bytes to, so its suite is run while debugging something else more
# often than on its own account. A green CI run printed 2,132 lines across its
# two legs, 627 of them the four test steps -- and two of those steps already
# redirected to a file and then `cat` it straight back on every run, green or
# red. A passing run that prints 627 lines hides the twenty that matter, and
# every reader pays: a person scrolling, a CI log viewer, and an agent working
# in the repository, which re-reads its whole transcript on each step and so
# pays for one loud run many times over.
#
#     tier            measured (2026-10-05)    budget          headroom
#     -------------   ---------------------    ------------    ----------
#     release         254 lines, 14,378 B      340 / 20,000    34% / 39%
#     release-oracle   71 lines,  2,586 B      105 /  4,000    48% / 55%
#     debug           254 lines, 14,378 B      340 / 20,000    34% / 39%
#     debug-oracle     71 lines,  2,586 B      105 /  4,000    48% / 55%
#     installed        30 lines,  1,292 B       40 /  2,500    25% / 48%
#
# installed (#45) was measured warm on macOS, against the unpacked release
# tarball: CI compiles its test binaries in a step before the tier, so no
# `Compiling` line reaches its log. Its floor is the 11 tests the three CLI
# suites hold, the lzop oracle ones included.
#
# Raised on 2026-10-05 (#38) from 270 / 16,000 and 70 / 4,000, measured in CI
# run 37320119187 on ubuntu-latest: the `cli` feature adds clap and rust-fs-core to
# the `Compiling` lines and three test binaries (cli, release_cli,
# release_attestation's growth) to the per-binary result lines. The debug
# tiers did not run in that run (the matrix stopped on the oracle tier's
# budget); they print the same shape as release and carry its figures.
#
# Each was measured from one cold run -- `cargo clean` first -- on an aarch64
# Linux host, so the `Compiling` lines are in the number. The two profiles run
# the same targets and print the same shape, so they carry the same budget;
# the release figure quoted is the debug one, its own cold run having been
# taken before seven tests were added to tests/ci_profile.rs. The headroom is
# for a runner that compiles a different dependency set, not for a suite to
# grow into quietly.
#
# THE FLOORS WERE RE-MEASURED AND TWO OF THEM WENT UP. 135 tests execute in
# each profile -- 28 library, 101 in tests/ci_profile.rs, 5 in
# tests/fuzz_decoders.rs and 1 doc test -- against a release floor of 26 that
# was measured in September 2026 when this repository had 28 tests and no
# integration suites, and a debug floor of 110 measured before
# tests/fuzz_decoders.rs existed. Both are now 121, a tenth below the
# measurement, which is the margin the old floors used. The oracle floors stay
# at 9 against 10 executed.
#
# RAISE A BUDGET WITH THE MEASUREMENT THAT JUSTIFIES IT, and raise it in
# .github/workflows/ci.yml in the same breath --
# tests/scripts/test-tier-budgets-agree.sh fails a pull request where the two
# files disagree. A budget nobody can breach measures nothing; one lowered to
# fit a noisy run measures less than nothing.
#
# THE FLOORS ARE THE OTHER HALF, and they were already here -- inline in four
# ci.yml steps, eight lines each, and nowhere a developer would meet them. A
# budget fails a tier that PRINTS too much; nothing fails a tier that printed
# almost nothing because it RAN almost nothing, and `cargo test` exits 0 on
# "0 passed; 0 failed". The numbers stayed at the call site where they belong;
# only the counting moved, into ../rust-fs-core/scripts/test-floor.sh.
#
# THERE IS NO COPY OF output-budget.sh OR tier.sh HERE, deliberately. Both
# are rust-fs-core's, run in place from the ../rust-fs-core sibling that
# `chore siblings` checks out at the pinned version. A copy
# committed here under another name is how the family came to have three
# divergent copies reached four different ways, with nothing comparing them.
#
# VERBOSE IS `OUTPUT_BUDGET_VERBOSE=1`, or `chore test:debug -- --verbose`. It
# streams the run and does NOT lift the budget. It is not `FLTH_VERBOSE` any
# more -- that name is simply not read, and setting it fails silently.
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: lzo1x

tasks:
  lint:
    desc: Formatting and clippy, exactly as CI runs them
    # `--locked` is not decoration. It makes the build fail rather than
    # silently update Cargo.lock, which is what keeps a local gate and CI
    # checking the same dependency versions — and it is what the release
    # process relies on.
    #
    # This exists so the CI gate can be reproduced locally. If the two ever
    # differ, this is the copy that is wrong.
    cmds:
      - bash ../rust-fs-core/scripts/agents-core-check.sh
      - bash ../rust-fs-core/scripts/ci-gate.sh
      - cargo fmt --check
      - cargo clippy --locked --all-targets --features cli -- -D warnings

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here -- a guard that has
    # to be registered somewhere else is a guard that gets silently skipped.
    # CI runs the same loop in the test job.
    cmds:
      - |
        set -eu
        for t in tests/scripts/*.sh; do
          echo "== $t"
          bash "$t"
        done

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    # Against the newest version on crates.io, with cargo-semver-checks: a
    # break needs the 0.x minor to move, an addition the patch. Why, and what
    # it cannot see, is at the top of the script. No `sources:` on purpose --
    # the baseline is the registry, which moves without this tree changing,
    # so a fingerprint would call a stale answer up to date.
    #
    # THE BUDGET is rust-fs-ext4's measurement of the same script: 11 lines /
    # 489 bytes passing with the baseline's rustdoc cached, one line more when
    # it is built. Its lines are fixed, not per item, so 40 / 4,000 leaves
    # room for a warning block without hiding a flood.
    #
    # NO FLOOR, and it is the one tier without one. cargo-semver-checks runs
    # 196 lints while the version matches the published one, but once
    # Cargo.toml declares a break it runs none ("0 checks: 0 pass, 254 skip"),
    # so any floor above zero would fail the release that bumps the minor
    # (rust-fs-ext4 met this first, #120). tests/scripts/test-tier-budgets-
    # agree.sh exempts it by name.
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- bash ../rust-fs-core/scripts/semver-check.sh'

  siblings:
    desc: Check out ../rust-fs-core, which owns the output-budget wrapper
    # THE ONE SIBLING. The library does not depend on it; the `cli` feature
    # does, as an optional path dependency that cargo resolves for every
    # command, so a bare checkout needs it to build at all. ../rust-fs-core/scripts/tier.sh
    # needs it too, because ../rust-fs-core/scripts/output-budget.sh lives there and nowhere
    # else. The alternative
    # was a repo-local script meeting the same contract, and that is the
    # option this repository did not take: written locally it would be a
    # near-copy of core's under another name, which is exactly how the family
    # ended up with three divergent copies.
    #
    # v0.2.23 is the release the `cli` feature's rust-fs-core requirement
    # names. v0.2.18 was the first release that also serves ci-gate, after the floor
    # and semver check (v0.2.16), and v0.3.2 the first whose
    # scripts all run in place from this checkout, so none is copied here. The ref is repeated in
    # .github/workflows/ci.yml, which cannot call this task without installing
    # chore on two runner platforms.
    cmds:
      - |
        set -eu
        if [ -e ../rust-fs-core ]; then
          echo "rust-fs-core: already checked out at ../rust-fs-core, left alone"
        else
          git clone --depth 1 --branch v0.3.6 \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
        fi

  test:release:
    desc: The suite in the release profile, which is the one that ships
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh "test (release)" release 340 20000 -- cargo test --locked --features cli --release'
      - 'bash ../rust-fs-core/scripts/test-floor.sh release 121'

  test:release:oracle:
    desc: The lzop oracle in the release profile
    # THE ONLY CHECK HERE THAT IS NOT SELF-REFERENTIAL. Everything else in
    # this repository compares this decoder against fixtures this repository
    # wrote; these push real lzop output through it.
    cmds:
      - task: tools
      - 'bash ../rust-fs-core/scripts/tier.sh "test (release, oracle)" release-oracle 105 4000 -- cargo test --locked --features cli --release -- --ignored'
      - 'bash ../rust-fs-core/scripts/test-floor.sh release-oracle 9'

  test:installed:
    desc: The CLI suites against the packaged tool, as a user installs it
    # LZO1X_BIN names the binary; CI points it at bin/lzo1x unpacked from the
    # release tarball (#45). Locally: LZO1X_BIN="$(brew --prefix)/bin/lzo1x".
    cmds:
      - 'test -n "${LZO1X_BIN:-}" || { echo "test:installed: set LZO1X_BIN to the lzo1x to test" >&2; exit 1; }'
      - task: tools
      - 'bash ../rust-fs-core/scripts/tier.sh "test (installed)" installed 40 2500 -- cargo test --locked --features cli --release --test cli --test cli_files --test oracle_lzop_files -- --include-ignored'
      - 'bash ../rust-fs-core/scripts/test-floor.sh installed 11'

  test:debug:
    desc: The suite in the debug profile, where an overflow can be seen
    # EXPECT_OVERFLOW_CHECKS ARMS THE PROBE in src/lib.rs that asks the build
    # to prove it traps an overflow, rather than inferring it from which
    # spellings of "disabled" happen to be absent from Cargo.toml. It belongs
    # on THIS tier and no other: the release tiers have the checks off on
    # purpose, and the oracle selections run only `#[ignore]` tests, which the
    # probe is not.
    cmds:
      - 'EXPECT_OVERFLOW_CHECKS=1 bash ../rust-fs-core/scripts/tier.sh "test (debug)" debug 340 20000 -- cargo test --locked --features cli'
      - 'bash ../rust-fs-core/scripts/test-floor.sh debug 121'

  test:debug:oracle:
    desc: The lzop oracle in the debug profile, where an overflow would fire
    # WHERE AN OVERFLOW IS MOST LIKELY TO FIRE: real lzop output and
    # deliberately adversarial streams, in the profile that can see a wrap. No
    # handshake here -- this selection runs only `#[ignore]` tests and the
    # probe is an ordinary unit test, so the variable would arm an assertion
    # this run never executes.
    cmds:
      - task: tools
      - 'bash ../rust-fs-core/scripts/tier.sh "test (debug, oracle)" debug-oracle 105 4000 -- cargo test --locked --features cli -- --ignored'
      - 'bash ../rust-fs-core/scripts/test-floor.sh debug-oracle 9'

  tools:
    desc: Verify the oracle tool is present, and fail naming it when it is not
    silent: true
    # NOTHING SKIPS. This task used to be part of `test:oracle`, which printed
    # a SKIPPED message and exited 0 when lzop was absent -- and a skip that a
    # floor cannot see reads exactly like a pass. The oracle tests are
    # `#[ignore]`d so that a fresh `cargo test` is green without lzop, which is
    # right; what was wrong was a chore task claiming to have run them.
    cmds:
      - |
        if ! command -v lzop >/dev/null 2>&1; then
          echo "lzop is not installed, and the oracle tier cannot run without it." >&2
          echo "  It is the reference LZO compressor and the only check here that is" >&2
          echo "  not this repository marking its own homework. CI installs it and" >&2
          echo "  runs it, so a run without it is weaker than the one that gates the" >&2
          echo "  pull request -- which is why this fails instead of skipping." >&2
          echo "    Debian/Ubuntu: sudo apt-get install -y lzop" >&2
          echo "    macOS:         brew install lzop" >&2
          exit 1
        fi
        echo "lzop: $(command -v lzop)"

  test:
    desc: Every test tier, exactly as CI runs them
    cmds:
      - task: test:release
      - task: test:release:oracle
      - task: test:debug
      - task: test:debug:oracle
      - task: test:scripts

  build:
    desc: Debug build
    cmds: ['cargo build']

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  staticlib:
    desc: Build the static library into this crate's dist/
    # NO `out` ARGUMENT, deliberately, matching the sibling libraries. A
    # library does not write into its consumer: it builds into its own dist/
    # and a consumer asks where that is via `chore artifact`. Inverting it
    # that way lets this crate change its output layout without every
    # consumer knowing, and keeps it usable with no consumer at all.
    vars:
      OUT: 'dist'

    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer, so a pattern containing
    # {{ }} is expanded against the raw text, matches nothing, and stores the
    # empty-set hash — the task then never registers as up to date.
    #
    # No 'include/*.h' entry, unlike the siblings: this crate has no headers.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'

    # Templated, which is fine here where it is not fine above: UpToDate
    # renders these before expanding them, and the entry is an exact path
    # rather than a glob, so a missing artifact is caught by the pattern
    # failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'

    cmds:
      # Idempotent: rustup answers "up to date" without touching the network
      # when the target is already installed. It runs here rather than in a
      # consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, even though dist/ holds exactly one
    # file here and rust-blk-probe's single-output `artifact` names its file.
    # The sibling LIBRARIES all print a directory and consumers copy its
    # contents; matching them means a consumer needs one rule for every
    # library, and it means adding a header later would not change this
    # contract. A CONSUMER COPIES THE CONTENTS of what this prints.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'
