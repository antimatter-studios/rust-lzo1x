name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # lzop is the reference LZO compressor and the oracle for the
      # #[ignore]-gated tests below. It is run as an external process
      # only -- nothing from it is linked or redistributed.
      - name: Install lzop (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lzop
      - name: Install lzop (macOS)
        if: runner.os == 'macOS'
        run: brew install lzop
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      # Oracle tests are #[ignore]-gated so a fresh checkout without lzop
      # still has a green `cargo test`. CI installed it above, so opt in.
      - run: cargo test --locked --release -- --ignored
