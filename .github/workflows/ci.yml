name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # Every pull request, whatever its base: a filter here skips a pull
  # request stacked on another one's branch, which then reads as CLEAN
  # with no checks at all (#26, tests/ci_triggers.rs).
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # lzop is the reference LZO compressor and the oracle for the
      # #[ignore]-gated tests below. It is run as an external process
      # only -- nothing from it is linked or redistributed.
      - name: Install lzop (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lzop
      - name: Install lzop (macOS)
        if: runner.os == 'macOS'
        run: brew install lzop
      # rust-fs-core is checked out for two things: scripts/output-budget.sh,
      # which every tier below runs through and which lives there and nowhere
      # else, and the `cli` feature's command-line plumbing, an optional path
      # dependency cargo resolves for every command. The library itself does
      # not depend on it. `chore siblings` does the same thing for a
      # developer; the ref is repeated here because the workflow cannot call
      # a chore task without installing chore on two runner platforms.
      - name: clone rust-fs-core, which owns the output-budget wrapper and the CLI plumbing
        run: |
          git clone --depth 1 --branch v0.2.23 \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features cli -- -D warnings
      # The shell tests, by glob, so a guard added later needs no edit here.
      # Each prints a PASS line or fails the step.
      - name: PyYAML, which the workflow guards in tests/scripts read with
        # ubuntu-latest ships python3-yaml; macos-latest's Python does not,
        # and a guard that cannot parse the workflows fails rather than skips.
        if: runner.os == 'macOS'
        run: python3 -m pip install --user --break-system-packages pyyaml
      - name: script tests (tests/scripts/*.sh)
        run: |
          set -euo pipefail
          for t in tests/scripts/*.sh; do
            echo "== $t"
            bash "$t"
          done
      # The family scripts are rust-fs-core's alone: this fails if a copy of
      # one is committed here, scripts/core.sh differs from core's, or
      # anything here still calls a local copy.
      - name: no copy of a rust-fs-core family script
        shell: bash
        run: bash scripts/core.sh family-check
      # .github-guard requires ci-ok and nothing else, and ci-ok needs every
      # job below: rust-fs-core's ci-gate holds both halves, so a job added
      # without ci-ok, or a check named by hand again, fails here. Every leg
      # runs it; PyYAML is installed above on macOS.
      - name: the one required check stands for every job
        shell: bash
        run: bash scripts/core.sh ci-gate
      # THE FOUR TIERS, EACH QUIET AND EACH UNDER A MEASURED BUDGET (#20).
      #
      # These four steps printed 627 of this job's 1,095 lines, and two of
      # them already redirected to a file and then `cat` it straight back on
      # every run, green or red. scripts/tier.sh sends the transcript to
      # tmp/logs/<tier>.log and prints one verdict line; the log is uploaded
      # below, so nothing is lost, it is just not recited.
      #
      # THE BUDGETS AND FLOORS ARE chores.yml's, REPEATED. The workflow cannot
      # read that file without installing chore on two runner platforms, and
      # tests/scripts/test-tier-budgets-agree.sh fails a pull request in which
      # the two disagree. Raise a number in both or in neither.
      #
      # THE COMMAND'S OWN STATUS IS STILL WHAT DECIDES THE STEP, which is the
      # property tests/ci_profile.rs exists to protect: the wrapper redirects
      # rather than pipes, and returns the status `cargo test` returned.
      # That can no longer be read off this text, so it is proved by running
      # it -- tests/scripts/test-tier-wrapper.sh drives the wrapper with a
      # command that exits 7 and requires 7 back, and ci_profile.rs fails if
      # that guard ever disappears.
      - name: test (release)
        shell: bash
        run: |
          bash scripts/tier.sh "test (release)" release 270 16000 -- cargo test --locked --features cli --release
          bash scripts/core.sh test-floor release 121

      # THE ORACLE SELECTION, which is disjoint from every other one here and
      # can empty on its own: an `#[ignore]` dropped, the tests moved to
      # another file, or lzop missing from the image would each leave it
      # selecting nothing, printing "0 passed" and exiting 0. Its floor is
      # what makes that loud.
      - name: test (release, oracle)
        shell: bash
        run: |
          bash scripts/tier.sh "test (release, oracle)" release-oracle 70 4000 -- cargo test --locked --features cli --release -- --ignored
          bash scripts/core.sh test-floor release-oracle 9

      # A DEBUG RUN BESIDE THE RELEASE ONES, NOT INSTEAD OF THEM (#13).
      # `[profile.release]` does not enable overflow-checks -- deliberately,
      # that is what ships -- so with only the release steps above, no
      # arithmetic overflow anywhere in the codec could be observed by any
      # test in any job. An LZO1X decoder is a loop over lengths and
      # back-references read out of untrusted input, and the arithmetic in
      # that loop IS the parser: a computation that wraps there is how a
      # malformed stream becomes an out-of-bounds index.
      #
      # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO. It
      # tells `overflow_checks::the_build_the_gate_asked_to_check_does_check`
      # in src/lib.rs that THIS is the run that must trap one -- asking the
      # build directly rather than inferring it from which spellings of
      # "disabled" are absent from Cargo.toml. It is an `env:` mapping so it
      # reaches the run wherever the run sits in the script, and it is on THIS
      # step and no other: the release steps have the checks off on purpose,
      # and the `-- --ignored` selections cannot execute the probe at all.
      #
      # Deleting this step, or dropping its variable, turns
      # tests/ci_profile.rs red.
      - name: test (debug, overflow checks armed)
        shell: bash
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
        run: |
          bash scripts/tier.sh "test (debug)" debug 270 16000 -- cargo test --locked --features cli
          bash scripts/core.sh test-floor debug 121

      # AND THE ORACLE SUITE IN DEBUG TOO, WHICH IS WHERE AN OVERFLOW IS MOST
      # LIKELY TO FIRE: real lzop output and deliberately adversarial streams,
      # in the profile that can see a wrap. NO HANDSHAKE HERE, on purpose --
      # this selection runs only `#[ignore]` tests and the probe is an
      # ordinary unit test, so the variable would arm an assertion this run
      # never executes.
      - name: test (debug, oracle)
        shell: bash
        run: |
          bash scripts/tier.sh "test (debug, oracle)" debug-oracle 70 4000 -- cargo test --locked --features cli -- --ignored
          bash scripts/core.sh test-floor debug-oracle 9

      # A quiet tier keeps everything; it just does not print it. Without this
      # the transcript of a failing run dies with the runner, and the one-line
      # verdict a failure prints names a log nobody can fetch. There is no
      # upload-artifact anywhere else in this repository.
      - name: keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-${{ matrix.os }}
          path: tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # The aggregate gate. Branch protection names checks as strings, so a list of
  # matrix legs has to be kept in step with the matrix by hand, and the day
  # someone adds a leg the new leg gates nothing until a human remembers to go
  # and require it. This job `needs:` the matrix as a whole, so it covers every
  # leg the matrix ever grows.
  #
  # `if: always()` so it reports on every pull request whatever the matrix did
  # -- a check that does not report cannot block, and a skipped required check
  # is indistinguishable from an absent one. And it insists on the exact string
  # `success`: a matrix that was cancelled, or skipped because an earlier job
  # never ran, is not a matrix that passed, and treating anything but success
  # as failure is what stops this job becoming a green-for-no-work check, the
  # failure a CI audit across the sibling repositories was about.
  semver:
    # `chore check:semver`, spelled out because the workflow does not install chore: this tree's public API against the newest
    # version on crates.io, refusing a break the version in Cargo.toml does
    # not declare. Why, and what it cannot see, is at the top of
    # scripts/semver-check.sh.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
      # rust-fs-core for scripts/output-budget.sh only, as in the test job.
      - name: clone rust-fs-core, which owns the output-budget wrapper
        run: |
          git clone --depth 1 --branch v0.2.23 \
            https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: semver (quiet, budgeted)
        shell: bash
        run: bash scripts/tier.sh semver semver 40 4000 -- bash scripts/core.sh semver-check

  ci-ok:
    name: ci-ok
    needs: [test, semver]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # EVERY job in `needs`, read from `needs` itself. This step once named
      # `test` alone while `needs` also held `semver`, so a public-API break
      # failed its own job and ci-ok still went green. Reading the whole
      # context means a job added to `needs` is judged without editing this.
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
              echo "::error::not 'success': $bad -- failure, cancellation and skipping all mean the gate did not run to completion"
              exit 1
          fi
          echo "all gating jobs succeeded"
