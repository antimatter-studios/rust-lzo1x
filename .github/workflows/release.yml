name: release

# Publishing runs only for a version tag, and only after the same gate
# that guards the branch. A release that skipped the oracle tests would
# ship a decoder validated against nothing but its own fixtures.
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      # lzop is the reference LZO compressor and the oracle for the
      # #[ignore]-gated tests. It is run as an external process only;
      # nothing from it is linked or redistributed.
      - name: install lzop
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lzop

      # A tag that disagrees with Cargo.toml would publish a version
      # nobody asked for, and the mistake is unrecoverable once the
      # version number is taken.
      - name: verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "tag and Cargo.toml agree on $version"

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test (default selection, with a floor)
        shell: bash
        run: |
          cargo test --locked --release 2>&1 | tee "$RUNNER_TEMP/test-default.log"
          rc=${PIPESTATUS[0]}
          # The same floor ci.yml carries, for the same reason and with more
          # at stake: `cargo test` exits 0 on "0 passed; 0 failed", so an empty
          # selection is indistinguishable from a full run by exit status
          # alone, and here a green run publishes a crate version that can
          # never be republished. Measured 2026-09-17 on CI run 34610842299
          # (main, fbb69d3): 28 executed -- 27 lib unit tests plus 1 doc test.
          # Measured on CI rather than here because this workflow runs only on
          # a version tag; it is the same crate, the same two selections and
          # the same commands, so the count carries over and the next tag is
          # where this floor first executes.
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-default.log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 26)"
          if [ "$n" -lt 26 ]; then
              echo "::error::only $n tests executed, floor is 26 -- 28 ran on 2026-09-17 in run 34610842299, and a release that executes less than that stopped early rather than passed"
              exit 1
          fi
          exit "$rc"
      # The oracle tests are the ones that prove this decoder reads what
      # a real encoder writes, so a release must not skip them.
      - name: cargo test --ignored (oracle selection, with its own floor)
        shell: bash
        run: |
          cargo test --locked --release -- --ignored 2>&1 | tee "$RUNNER_TEMP/test-ignored.log"
          rc=${PIPESTATUS[0]}
          # Its own floor, because `--ignored` selects a set disjoint from the
          # default run and can empty independently -- an #[ignore] removed, a
          # test file moved, or lzop missing from the image would each leave
          # this step selecting nothing and still exiting 0. "A release must
          # not skip the oracle tests" is only enforceable if something counts
          # them. Measured 2026-09-17 on CI run 34610842299: 10 executed.
          # Floor 9, and deliberately above zero.
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-ignored.log" | awk '{s+=$4} END{print s+0}')
          echo "ignored tests executed: $n (floor 9)"
          if [ "$n" -lt 9 ]; then
              echo "::error::only $n ignored tests executed, floor is 9 -- 10 ran on 2026-09-17 in run 34610842299, and a release that executes less than that stopped early rather than passed"
              exit 1
          fi
          exit "$rc"

  publish:
    name: publish to crates.io
    needs: [test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a first release published by hand before trusted
      # publishing was configured — would otherwise fail this job every
      # time. Skip instead, so the workflow is idempotent and a red run
      # means something actually went wrong.
      - name: Skip if this version is already on crates.io
        id: already
        shell: bash
        run: |
          set -euo pipefail
          name="$(grep -m1 '^name = ' Cargo.toml | sed 's/name = //; s/"//g')"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = //; s/"//g')"
          if curl -sf "https://crates.io/api/v1/crates/$name/$version" \
               -H 'User-Agent: release-workflow' >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name $version is not on crates.io; publishing."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
