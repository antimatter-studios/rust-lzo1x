[package]
name = "lzo1x-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The explorer half of the fuzzing setup. The gate half is
# tests/fuzz_decoders.rs in the parent crate, which replays and mutates
# the same corpus on the stable toolchain -- see that file's header for
# why the work is split in two.
#
# Run one target:
#   cargo +nightly fuzz run decompress -- -max_total_time=60
# Run all of them, which is what CI does:
#   scripts/fuzz-all.sh 60

[dependencies]
libfuzzer-sys = "0.4"
am-lzo1x = { path = ".." }

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
