[package]
name = "am-lzo1x"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust LZO1X compressor and decompressor. Implemented from the published stream grammar; no C bindings, no unsafe, no dependencies."
repository = "https://github.com/antimatter-studios/rust-lzo1x"
keywords = ["lzo", "lzo1x", "decompression", "compression", "squashfs"]
categories = ["compression", "filesystem"]
readme = "README.md"

[lib]
name = "lzo1x"
crate-type = ["staticlib", "rlib"]

# Raw-block compress/decompress, so the cross-validation gate against
# the reference tool is a shell one-liner rather than a harness that has
# to link this crate. No dependencies: the crate has none and this does
# not introduce the first.
[[bin]]
name = "lzo1x"
path = "src/bin/lzo1x.rs"

[dependencies]

[dev-dependencies]
# YAML parser for tests/ci_profile.rs, which reads
# .github/workflows/ci.yml and refuses if the debug run that lets the PR
# gate see an arithmetic overflow has been removed or disabled. It
# PARSES the file rather than scanning its text: quoted keys, block
# scalars, comments and nested mappings are the grammar, not edge cases,
# and a guard that misreads its input reports protection it is not
# providing. Pure Rust, YAML 1.2 (so GitHub's `on:` key stays the string
# `on` and is not folded into a boolean), MIT/Apache-2.0, and no C to
# transpile -- unlike serde_yaml, which is deprecated and wraps
# unsafe-libyaml. Same version as the siblings, so the copies of this
# guard stay one answer rather than several.
#
# THE DESCRIPTION ABOVE STILL SAYS "no dependencies" AND STILL MEANS IT.
# A dev-dependency is built for this crate's own test and example
# targets and for nothing else: it is not in the dependency graph
# `cargo add am-lzo1x` resolves, not in the published .crate's
# [dependencies], and not linked into the staticlib a consumer takes.
# The promise is about what a consumer has to build, and this is not
# something a consumer builds.
saphyr = "0.0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"
